name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please report security problems privately, following SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Click...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup or migrations
        - Reader
        - Scanlation teams
        - Shop and economy
        - Community
        - Admin panel
        - Translation studio
        - Translations (English or Turkish text)
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Browser, OS, Node version, commit
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any secrets and personal data first.
