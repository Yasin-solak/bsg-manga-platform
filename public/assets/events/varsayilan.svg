<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260">
  <!--
    Etkinlik afisi icin GENIS (yaklasik 3.7:1) yer tutucu. Menude ve ana
    sayfada etkinlik karti banner olarak basiliyor; manga KAPAGI (dikey)
    konursa object-cover ortadan kirpar ve kapagin kendi yazisi bannerin
    uzerine tasar. Bu dosya, admin gercek afisi yukleyene kadar dogru
    oranda bir zemin verir.
  -->
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a2d0c"/>
      <stop offset="0.55" stop-color="#7c4a12"/>
      <stop offset="1" stop-color="#2a1636"/>
    </linearGradient>
    <radialGradient id="isik" cx="0.78" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="nokta" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#ffffff" opacity=".09"/>
    </pattern>
  </defs>
  <rect width="960" height="260" fill="url(#zemin)"/>
  <rect width="960" height="260" fill="url(#nokta)"/>
  <rect width="960" height="260" fill="url(#isik)"/>
  <g opacity=".22" fill="none" stroke="#ffffff" stroke-width="2">
    <circle cx="795" cy="70" r="46"/>
    <circle cx="880" cy="180" r="30"/>
    <circle cx="700" cy="196" r="18"/>
  </g>
</svg>
